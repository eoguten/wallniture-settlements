<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Wallniture — Settlement Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#0f1117; --card:#1a1d27; --border:#2a2d3a;
    --text:#e8eaf0; --muted:#8b8fa8;
    --green:#34d399; --red:#f87171;
    --std:#4f8ef7; --inv:#a78bfa;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        background:var(--bg); color:var(--text); font-size:14px; }

  /* ── Header ── */
  header{ padding:16px 16px 14px; border-bottom:1px solid var(--border);
           display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  header h1{ font-size:15px; font-weight:700; line-height:1.3; }
  header .sub{ font-size:11px; color:var(--muted); margin-top:2px; }
  .updated{ font-size:11px; color:var(--muted); white-space:nowrap; padding-top:2px; }

  /* ── Container ── */
  .container{ padding:16px; max-width:1400px; margin:0 auto; }

  /* ── Filters ── */
  .filters{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  .filter-label{ font-size:11px; color:var(--muted); }
  .filter-btn{ padding:6px 14px; border-radius:20px; border:1px solid var(--border);
               background:var(--card); color:var(--muted); cursor:pointer; font-size:12px;
               transition:all .15s; -webkit-tap-highlight-color:transparent; }
  .filter-btn.active{ border-color:var(--std); color:var(--std); background:rgba(79,142,247,.12); }
  .filter-btn.inv.active{ border-color:var(--inv); color:var(--inv); background:rgba(167,139,250,.12); }

  /* ── KPIs ── */
  .kpis{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
  .kpi{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 14px; }
  .kpi .label{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; }
  .kpi .value{ font-size:18px; font-weight:700; line-height:1.2; }
  .kpi .sub{ font-size:11px; color:var(--muted); margin-top:3px; }
  .kpi.tot .value{ color:var(--green); }
  .kpi.std .value{ color:var(--std); }
  .kpi.inv .value{ color:var(--inv); }

  /* ── Chart cards ── */
  .chart-card{ background:var(--card); border:1px solid var(--border); border-radius:10px;
               padding:14px; margin-bottom:12px; }
  .chart-card h3{ font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase;
                   letter-spacing:.06em; margin-bottom:12px; }

  /* ── Section card ── */
  .section-card{ background:var(--card); border:1px solid var(--border); border-radius:10px;
                  margin-bottom:12px; overflow:hidden; }
  .section-card h3{ font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase;
                     letter-spacing:.06em; padding:12px 14px 10px; border-bottom:1px solid var(--border); }
  .section-note{ font-size:10px; color:var(--muted); font-weight:400; text-transform:none;
                  letter-spacing:0; display:block; margin-top:2px; }

  /* ── Settlement period cards (mobile-first) ── */
  .period-card{ padding:12px 14px; border-bottom:1px solid var(--border); }
  .period-card:last-child{ border-bottom:none; }
  .period-row1{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
  .period-dates{ font-size:12px; color:var(--muted); }
  .period-amount{ font-size:16px; font-weight:700; color:var(--green); white-space:nowrap; }
  .period-row2{ display:flex; align-items:center; gap:8px; }
  .period-id{ font-size:10px; color:var(--muted); font-family:monospace; }
  .expand-btn{ font-size:11px; color:var(--std); background:none; border:none; cursor:pointer;
               padding:0; margin-left:auto; -webkit-tap-highlight-color:transparent; }
  .breakdown-body{ display:none; padding:8px 14px 4px; background:rgba(0,0,0,.2); }
  .breakdown-body.open{ display:block; }
  .bd-row{ display:flex; justify-content:space-between; padding:4px 0;
            border-bottom:1px solid rgba(255,255,255,.04); font-size:12px; }
  .bd-row:last-child{ border-bottom:none; }
  .bd-key{ color:var(--muted); flex:1; padding-right:8px; }
  .bd-val{ white-space:nowrap; font-variant-numeric:tabular-nums; }
  .bd-val.pos{ color:var(--green); }
  .bd-val.neg{ color:var(--red); }

  /* ── Transaction type rows ── */
  .txn-row{ padding:10px 14px; border-bottom:1px solid var(--border); }
  .txn-row:last-child{ border-bottom:none; }
  .txn-row-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:5px; }
  .txn-name{ font-size:12px; font-weight:500; flex:1; }
  .txn-amount{ font-size:13px; font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .txn-amount.pos{ color:var(--green); }
  .txn-amount.neg{ color:var(--red); }
  .txn-row-bot{ display:flex; align-items:center; gap:8px; }
  .badge{ display:inline-block; font-size:10px; font-weight:600; padding:2px 7px;
           border-radius:10px; white-space:nowrap; }
  .badge.std{ background:rgba(79,142,247,.15); color:var(--std); }
  .badge.inv{ background:rgba(167,139,250,.15); color:var(--inv); }
  .pct-bar-wrap{ display:flex; align-items:center; gap:6px; flex:1; }
  .pct-bar{ height:5px; border-radius:3px; background:var(--std); opacity:.65; min-width:2px; }
  .pct-bar.neg{ background:var(--red); }
  .pct-label{ font-size:11px; color:var(--muted); white-space:nowrap; }

  /* ── Desktop overrides ── */
  @media(min-width:640px){
    .container{ padding:20px 24px; }
    header{ padding:18px 24px 16px; }
    header h1{ font-size:16px; }
    .kpis{ grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
    .kpi .value{ font-size:22px; }
    .charts-row{ display:grid; grid-template-columns:2fr 1fr; gap:12px; margin-bottom:12px; }
    .chart-card{ margin-bottom:0; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Wallniture — Settlement Dashboard</h1>
    <div class="sub">Sellbyeway Corp · US Marketplace</div>
  </div>
  <div class="updated" id="updated-label"></div>
</header>

<div class="container">
  <div class="filters">
    <span class="filter-label">Show:</span>
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('Standard',this)">Standard</button>
    <button class="filter-btn inv" onclick="setFilter('Invoiced',this)">Invoiced</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="charts-row">
    <div class="chart-card">
      <h3>Disbursements by Period</h3>
      <canvas id="barChart"></canvas>
    </div>
    <div class="chart-card">
      <h3>Transaction Mix</h3>
      <canvas id="donutChart"></canvas>
    </div>
  </div>

  <div class="section-card">
    <h3>Settlement Periods</h3>
    <div id="periods-list"></div>
  </div>

  <div class="section-card">
    <h3>Transaction Type Breakdown
      <span class="section-note">% = share of gross activity</span>
    </h3>
    <div id="txn-list"></div>
  </div>
</div>

<script>
const ALL_DATA = [{"id": "25297091161", "type": "Standard", "start": "2025-12-29", "end": "2026-01-12", "total": 84981.99, "breakdown": {"Order": 110057.53, "other-transaction": -18026.47, "Refund": -7191.97, "Liquidations": 241.97, "FBAFees": -124.56, "SAFE-T Reimbursement": 25.49, "Order_Retrocharge": 0.0}}, {"id": "25406826951", "type": "Standard", "start": "2026-01-12", "end": "2026-01-26", "total": 65653.03, "breakdown": {"Order": 89551.55, "other-transaction": -14795.64, "Refund": -9340.18, "Liquidations": 237.3, "Order_Retrocharge": 0.0}}, {"id": "25510107901", "type": "Standard", "start": "2026-01-26", "end": "2026-02-09", "total": 58289.33, "breakdown": {"Order": 76450.63, "other-transaction": -10416.94, "Refund": -7752.79, "Liquidations": 167.47, "FBAFees": -159.04, "Refund_Retrocharge": 0.0, "Order_Retrocharge": 0.0}}, {"id": "25630293521", "type": "Standard", "start": "2026-02-09", "end": "2026-02-23", "total": 61271.91, "breakdown": {"Order": 76818.68, "other-transaction": -9429.04, "Refund": -6316.55, "Liquidations": 198.82, "Order_Retrocharge": 0.0, "Refund_Retrocharge": 0.0}}, {"id": "25739632521", "type": "Standard", "start": "2026-02-23", "end": "2026-03-09", "total": 58200.48, "breakdown": {"Order": 77156.53, "other-transaction": -12569.55, "Refund": -6237.17, "Liquidations": 184.72, "FBAFees": -184.05, "ReceivablesDeductions": -150.0, "Order_Retrocharge": 0.0}}, {"id": "25851785651", "type": "Standard", "start": "2026-03-09", "end": "2026-03-23", "total": 50329.83, "breakdown": {"Order": 66767.59, "other-transaction": -10151.52, "Refund": -6457.32, "Liquidations": 171.08, "Refund_Retrocharge": 0.0, "Order_Retrocharge": 0.0, "Liquidations Adjustments": 0.0}}, {"id": "25963304161", "type": "Standard", "start": "2026-03-23", "end": "2026-04-06", "total": 6890.09, "breakdown": {"Order": 17317.31, "other-transaction": -6790.69, "Refund": -3603.56, "Chargeback Refund": -208.14, "Liquidations": 175.17, "Order_Retrocharge": 0.0}}, {"id": "26088228171", "type": "Standard", "start": "2026-04-06", "end": "2026-04-20", "total": 38286.8, "breakdown": {"Order": 51867.39, "other-transaction": -9630.04, "Refund": -4145.02, "Liquidations": 286.44, "FBAFees": -91.97, "Order_Retrocharge": 0.0}}, {"id": "25112857511", "type": "Invoiced", "start": "2025-12-04", "end": "2025-12-18", "total": 2394.19, "breakdown": {"Order": 2437.3, "Refund": -43.11}}, {"id": "25216847031", "type": "Invoiced", "start": "2025-12-18", "end": "2026-01-01", "total": 3018.1, "breakdown": {"Order": 3103.04, "Refund": -84.94}}, {"id": "25326529441", "type": "Invoiced", "start": "2026-01-01", "end": "2026-01-15", "total": 3439.36, "breakdown": {"Order": 3564.84, "Refund": -125.48}}, {"id": "25433069931", "type": "Invoiced", "start": "2026-01-15", "end": "2026-01-29", "total": 1851.42, "breakdown": {"Order": 1949.72, "Refund": -98.3}}, {"id": "25545112191", "type": "Invoiced", "start": "2026-01-29", "end": "2026-02-12", "total": 1886.88, "breakdown": {"Order": 1921.01, "Refund": -34.13}}, {"id": "25663384241", "type": "Invoiced", "start": "2026-02-12", "end": "2026-02-26", "total": 2148.34, "breakdown": {"Order": 2148.34}}, {"id": "25771433441", "type": "Invoiced", "start": "2026-02-26", "end": "2026-03-12", "total": 3239.37, "breakdown": {"Order": 3502.31, "Refund": -262.94}}, {"id": "25881415331", "type": "Invoiced", "start": "2026-03-12", "end": "2026-03-26", "total": 4020.87, "breakdown": {"Order": 4104.95, "Refund": -84.08}}, {"id": "25995798771", "type": "Invoiced", "start": "2026-03-26", "end": "2026-04-09", "total": 1607.2, "breakdown": {"Order": 1607.2}}, {"id": "26123275341", "type": "Invoiced", "start": "2026-04-09", "end": "2026-04-23", "total": 2571.34, "breakdown": {"Order": 2571.34}}];
let filter='all', barChart, donutChart;

const fmt  = n=>'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtS = n=>(n<0?'-':'')+fmt(n);

function filtered(){ return filter==='all'?ALL_DATA:ALL_DATA.filter(s=>s.type===filter); }

function setFilter(f,btn){
  filter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render(){
  const d=filtered();
  renderKPIs(d); renderBar(d); renderDonut(d); renderPeriods(d); renderTxn(d);
}

function renderKPIs(d){
  const std=d.filter(s=>s.type==='Standard'), inv=d.filter(s=>s.type==='Invoiced');
  const sT=std.reduce((a,s)=>a+s.total,0), iT=inv.reduce((a,s)=>a+s.total,0), g=sT+iT;
  document.getElementById('kpis').innerHTML=`
    <div class="kpi tot"><div class="label">Total Disbursed</div><div class="value">${fmt(g)}</div><div class="sub">${d.length} periods</div></div>
    <div class="kpi std"><div class="label">Standard</div><div class="value">${fmt(sT)}</div><div class="sub">${std.length} periods</div></div>
    <div class="kpi inv"><div class="label">Invoiced</div><div class="value">${fmt(iT)}</div><div class="sub">${inv.length} periods</div></div>
    <div class="kpi"><div class="label">Avg / Period</div><div class="value" style="color:var(--text)">${d.length?fmt(g/d.length):'—'}</div><div class="sub">all types</div></div>`;
}

function renderBar(d){
  const s=[...d].sort((a,b)=>a.start.localeCompare(b.start));
  const labels=s.map(x=>x.start.slice(5)+'→'+x.end.slice(5));
  if(barChart)barChart.destroy();
  barChart=new Chart(document.getElementById('barChart'),{
    type:'bar',
    data:{labels,datasets:[
      {label:'Standard',data:s.map(x=>x.type==='Standard'?x.total:0),backgroundColor:'rgba(79,142,247,.75)',borderRadius:3},
      {label:'Invoiced', data:s.map(x=>x.type==='Invoiced'?x.total:0), backgroundColor:'rgba(167,139,250,.75)',borderRadius:3}
    ]},
    options:{responsive:true,maintainAspectRatio:true,
      plugins:{legend:{labels:{color:'#8b8fa8',font:{size:10},boxWidth:10}}},
      scales:{
        x:{stacked:true,ticks:{color:'#8b8fa8',font:{size:9},maxRotation:45},grid:{color:'rgba(255,255,255,.05)'}},
        y:{stacked:true,ticks:{color:'#8b8fa8',font:{size:9},callback:v=>'$'+(v/1000).toFixed(0)+'k'},grid:{color:'rgba(255,255,255,.05)'}}
      }
    }
  });
}

function renderDonut(d){
  const t={};
  d.forEach(s=>Object.entries(s.breakdown).forEach(([k,v])=>{t[k]=(t[k]||0)+v;}));
  const pos=Object.entries(t).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const colors=['#4f8ef7','#34d399','#a78bfa','#fb923c','#f472b6','#fbbf24','#60a5fa'];
  if(donutChart)donutChart.destroy();
  donutChart=new Chart(document.getElementById('donutChart'),{
    type:'doughnut',
    data:{labels:pos.map(([k])=>k),datasets:[{data:pos.map(([,v])=>v),backgroundColor:colors,borderWidth:0,hoverOffset:4}]},
    options:{responsive:true,maintainAspectRatio:true,cutout:'60%',
      plugins:{
        legend:{position:'bottom',labels:{color:'#8b8fa8',font:{size:10},boxWidth:10,padding:6}},
        tooltip:{callbacks:{label:ctx=>' '+ctx.label+': '+fmt(ctx.parsed)}}
      }
    }
  });
}

function renderPeriods(d){
  const s=[...d].sort((a,b)=>b.start.localeCompare(a.start));
  document.getElementById('periods-list').innerHTML=s.map((p,i)=>`
    <div class="period-card">
      <div class="period-row1">
        <div>
          <span class="badge ${p.type==='Standard'?'std':'inv'}">${p.type}</span>
        </div>
        <div class="period-amount">${fmt(p.total)}</div>
      </div>
      <div class="period-row2">
        <div class="period-dates">${p.start} → ${p.end}</div>
        <button class="expand-btn" onclick="toggleBD('bd${i}',this)">▶ details</button>
      </div>
      <div class="breakdown-body" id="bd${i}">
        ${Object.entries(p.breakdown).map(([k,v])=>`
          <div class="bd-row">
            <span class="bd-key">${k}</span>
            <span class="bd-val ${v>=0?'pos':'neg'}">${fmtS(v)}</span>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

function toggleBD(id,btn){
  const el=document.getElementById(id);
  const open=el.classList.toggle('open');
  btn.textContent=open?'▼ hide':'▶ details';
}

function renderTxn(d){
  const by={};
  d.forEach(s=>Object.entries(s.breakdown).forEach(([k,v])=>{
    if(!by[k])by[k]={std:0,inv:0};
    by[k][s.type==='Standard'?'std':'inv']+=v;
  }));
  const absSum=Object.values(by).reduce((a,v)=>a+Math.abs(v.std+v.inv),0)||1;
  const maxAbs=Math.max(...Object.values(by).map(v=>Math.abs(v.std+v.inv)));
  const rows=Object.entries(by).sort((a,b)=>Math.abs(b[1].std+b[1].inv)-Math.abs(a[1].std+a[1].inv));

  document.getElementById('txn-list').innerHTML=rows.map(([k,v])=>{
    const total=v.std+v.inv;
    const pct=(Math.abs(total)/absSum*100).toFixed(1);
    const barW=Math.round(Math.abs(total)/maxAbs*100);
    const neg=total<0;
    return `<div class="txn-row">
      <div class="txn-row-top">
        <span class="txn-name">${k}</span>
        <span class="txn-amount ${neg?'neg':'pos'}">${fmtS(total)}</span>
      </div>
      <div class="txn-row-bot">
        ${v.std!==0?'<span class="badge std">Standard</span>':''}
        ${v.inv!==0?'<span class="badge inv">Invoiced</span>':''}
        <div class="pct-bar-wrap">
          <div class="pct-bar ${neg?'neg':''}" style="width:${barW}%"></div>
          <span class="pct-label">${pct}%</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('updated-label').textContent=
  'Updated '+new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
render();
</script>
</body>
</html>
